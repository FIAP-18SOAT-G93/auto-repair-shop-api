name: Segurança

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    name: SonarCloud (análise estática)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:cov

      - name: Cache dos pacotes do SonarCloud
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Análise no SonarCloud
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  zap:
    name: OWASP ZAP (análise dinâmica)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: auto_repair_shop
      JWT_SECRET: jwt-secret-usada-apenas-para-o-ci-0123456789
      JWT_EXPIRES_IN: 1h
    steps:
      - uses: actions/checkout@v7

      - name: Sobe o banco, as migrations e a API
        run: docker compose up -d --build

      - name: Espera a API ficar saudável
        run: timeout 180 sh -c 'until curl -fs http://localhost:3000/health; do sleep 3; done'

      - name: Análise da API pela definição OpenAPI
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          target: http://localhost:3000/docs-json
          format: openapi
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-report

      - name: Logs dos contêineres
        if: failure()
        run: docker compose logs

      - name: Derruba o ambiente
        if: always()
        run: docker compose down -v

  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Análise das dependências
        uses: dependency-check/Dependency-Check_Action@main
        env:
          JAVA_HOME: /opt/jdk
        with:
          project: auto-repair-shop-api
          path: .
          format: HTML
          out: dependency-check-report
          args: >-
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
            --format JSON
            --exclude "**/src/generated/**"

      - name: Relatório do Dependency-Check
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: dependency-check-report/
          retention-days: 30
