sonar.organization=fiap-18soat-g93
sonar.projectKey=FIAP-18SOAT-G93_auto-repair-shop-api
sonar.projectName=auto-repair-shop-api

sonar.sources=src,prisma/seed.ts,Dockerfile,.github/workflows
sonar.tests=src,test
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts
sonar.exclusions=src/generated/**,**/*.spec.ts,**/*.e2e-spec.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=\
  src/main.ts,\
  src/app.module.ts,\
  src/health/**,\
  src/shared/application/**,\
  src/shared/infrastructure/**,\
  src/modules/*/*.module.ts,\
  src/modules/*/application/**,\
  src/modules/*/infrastructure/**,\
  src/modules/*/presentation/**,\
  src/modules/*/testing/**
